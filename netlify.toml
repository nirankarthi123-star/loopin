# ─────────────────────────────────────────────────────────────────────────────
# Netlify Configuration — LoopIn Frontend
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Builds workspace packages and generates the production Vite bundle
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

# SPA Fallback: Rewrite all HTML client routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
